<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{subject}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f5f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f5f8; padding: 24px 12px">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td style="height: 4px; line-height: 4px; font-size: 0; background-color: {{primaryColor}}">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding: 20px 24px 16px; background-color: #ffffff">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td valign="middle" style="padding-right: 16px">
                      {{headerLogo}}
                    </td>
                    <td valign="middle">
                      <p style="margin: 0; font-size: 18px; font-weight: 700; color: #12284e">
                        {{companyName}}
                      </p>
                      <p style="margin: 4px 0 0; font-size: 12px; color: #6b7280; font-style: italic">
                        {{tagline}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="height: 1px; line-height: 1px; font-size: 0; background-color: {{primaryColor}}">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px">
                <div
                  style="
                    font-size: 14px;
                    line-height: 1.6;
                    color: #111827;
                  "
                >
                  {{message}}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 24px; background-color: #f8f9fc; border-top: 1px solid #e5e7eb">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center">
                      <p style="margin: 0 0 8px; font-size: 11px; line-height: 1.5; color: #4b5563">
                        {{companyAddress}}
                      </p>
                      <p style="margin: 0 0 8px; font-size: 11px; font-weight: 700; color: #12284e">
                        {{companyCities}}
                      </p>
                      <p style="margin: 0; font-size: 11px; line-height: 1.5; color: #6b7280">
                        {{companyContact}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
